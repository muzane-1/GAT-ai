[project]
name = "aml-gnn"
version = "1.0.0"
description = "Production-grade AML detection with PyTorch Geometric GATv2"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]  # Any is fine in config metadata

# Legacy notebook-compatible modules (src/dataset.py, src/utils/legacy.py) are
# left untouched by strict rules so their public API surface stays stable.
[tool.ruff.lint.per-file-ignores]
"src/dataset.py" = ["ANN", "UP", "I", "E501"]
"src/utils/legacy.py" = ["ANN", "UP", "I", "E501"]
"notebooks/*.ipynb" = ["E501", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
