name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-pipeline:
    name: Lint, test, and 1-epoch dry-run inside Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aml-gnn:ci .

      - name: Lint (ruff)
        run: docker run --rm aml-gnn:ci ruff check .

      - name: Lint (format check)
        run: docker run --rm aml-gnn:ci ruff format --check .

      - name: Static type check (mypy)
        run: docker run --rm aml-gnn:ci mypy src/

      - name: Security scan (bandit)
        run: docker run --rm aml-gnn:ci bandit -r src/

      - name: Unit tests + coverage
        run: >-
          docker run --rm aml-gnn:ci
          python -m pytest --cov=src --cov-fail-under=80 tests/

      - name: Notebook execution (headless)
        # Run only 04 (the deterministic-synthetic validation notebook). 01-03
        # depend on the in-memory HF dataset and would time out in CI.
        run: >-
          docker run --rm aml-gnn:ci
          python -m nbconvert --execute notebooks/04_data_pipeline_validation.ipynb --to notebook --output-dir=/tmp/executed_notebooks

      - name: 1-epoch training dry-run
        run: >-
          docker run --rm aml-gnn:ci
          python -m src.training.train --epochs 1

      - name: Optuna smoke run (1 trial)
        run: >-
          docker run --rm aml-gnn:ci
          python -m src.training.tune --trials 1 --epochs 1
